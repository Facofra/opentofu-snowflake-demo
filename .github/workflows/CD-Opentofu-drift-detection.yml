name: "CD-Opentofu-drift-detection"

on:
  schedule:
    - cron: "0 8 * * 1-5"  # 08:00 America/Chicago Mon–Fri (PROD only)
      timezone: "America/Chicago"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        default: CICD
        options:
          - CICD
          - PROD

permissions:
  contents: read
  id-token: write

# Schedule trigger has no inputs, so it falls through to 'PROD'.
env:
  TARGET_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'PROD' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'PROD' }}
  cancel-in-progress: true


jobs:

  call-plan:
    uses: ./.github/workflows/CD-Opentofu-plan.yml
    with:
      environment: ${{ github.event_name != 'workflow_dispatch' && 'PROD' || inputs.environment }}

  notify-teams:
    name: "Notify Teams"
    runs-on: ubuntu-latest
    needs: call-plan
    if: needs.call-plan.outputs.has_changes == 'true'
    steps:
      - name: Send Teams alert
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST "${{ secrets.TEAMS_ALERTS_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "type": "message",
              "attachments": [{
                "contentType": "application/vnd.microsoft.card.adaptive",
                "content": {
                  "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                  "type": "AdaptiveCard",
                  "version": "1.2",
                  "body": [
                    {
                      "type": "TextBlock",
                      "text": "⚠️ IaC Drift Detected in ${{ env.TARGET_ENV }}",
                      "weight": "Bolder",
                      "size": "Medium"
                    },
                    {
                      "type": "TextBlock",
                      "text": "Drift was detected in the ${{ env.TARGET_ENV }} Snowflake environment. A remediation apply is pending approval.",
                      "wrap": true
                    },
                    {
                      "type": "ActionSet",
                      "actions": [{
                        "type": "Action.OpenUrl",
                        "title": "View Run ${{ github.run_id }}",
                        "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                      }]
                    }
                  ]
                }
              }]
            }'

  call-apply:
    needs: call-plan
    if: needs.call-plan.outputs.has_changes == 'true'
    uses: ./.github/workflows/CD-Opentofu-apply.yml
    with:
      environment: ${{ github.event_name != 'workflow_dispatch' && 'PROD' || inputs.environment }}