name: "CD-Opentofu-drift-detection"

on:
  schedule:
    - cron: "0 8 * * 1-5"  # 08:00 America/Chicago Mon–Fri (PROD only)
      timezone: "America/Chicago"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        default: CICD
        options:
          - CICD
          - PROD

permissions:
  contents: read
  id-token: write

# Schedule trigger has no inputs, so it falls through to 'PROD'.
env:
  TARGET_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'PROD' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'PROD' }}
  cancel-in-progress: true


jobs:

  call-plan:
    uses: ./.github/workflows/CD-Opentofu-plan.yml
    with:
      environment: ${{ github.event_name != 'workflow_dispatch' && 'PROD' || inputs.environment }}

  call-apply:
    needs: call-plan
    if: needs.call-plan.outputs.has_changes == 'true'
    uses: ./.github/workflows/CD-Opentofu-apply.yml
    with:
      environment: ${{ github.event_name != 'workflow_dispatch' && 'PROD' || inputs.environment }}