name: "CD-Opentofu-drift-detection"

on:
  push:
    branches:
      - test-drift-keys
  # schedule:
  #   - cron: "0 8 * * 1-5"  # 08:00 UTC Mon–Fri
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  PLAN_FILE: ${{ github.workspace }}/plans/snowflake-PROD-drift.tfplan

jobs:

  drift-detection:
    name: "Drift Detection"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./snowflake
    outputs:
      drift_detected: ${{ steps.plan.outputs.drift_detected }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.11.5
          tofu_wrapper: false

      - name: Tofu Init
        run: tofu init

      - name: Tofu Plan (drift check)
        shell: bash
        id: plan
        run: |
          mkdir -p ${{ github.workspace }}/plans
          set +e
          tofu plan -detailed-exitcode -input=false -out=${{ env.PLAN_FILE }}
          EXIT_CODE=$?
          echo "Exit code: $EXIT_CODE"

          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "No drift detected."
            echo "drift_detected=false" >> "$GITHUB_OUTPUT"
          elif [ "$EXIT_CODE" -eq 2 ]; then
            echo "Drift detected."
            echo "drift_detected=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tofu plan failed with exit code $EXIT_CODE"
            exit $EXIT_CODE
          fi

      - name: Upload Tofu Plan
        if: steps.plan.outputs.drift_detected == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: 'TF-Plan-PROD-drift'
          path: ${{ env.PLAN_FILE }}
          retention-days: 1

  remediate:
    name: "Tofu Apply (Drift Remediation)"
    runs-on: ubuntu-latest
    needs: [drift-detection]
    if: needs.drift-detection.outputs.drift_detected == 'true'
    defaults:
      run:
        working-directory: ./snowflake
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.11.5

      - name: Download Plan
        uses: actions/download-artifact@v4
        with:
          name: 'TF-Plan-PROD-drift'
          path: ${{ github.workspace }}/plans/

      - name: Tofu Init
        run: tofu init

      - name: Tofu Apply
        run: echo "----- placeholder applying ${{ env.PLAN_FILE }} -----"
        # run: |
        #   echo "----- TOFU APPLY -----"
        #   tofu apply -input=false ${{ env.PLAN_FILE }}
