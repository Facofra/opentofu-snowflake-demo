name: "Generate Snowflake Service Keys -> Azure Key Vault"

on:
  workflow_dispatch:
    inputs:
      service_name:
        description: "Snowflake service (ALL = todos)"
        required: true
        type: choice
        default: ALL
        options:
          - ALL
          - SERVICE_DBT
          - SERVICE_DBT_CICD
          - SERVICE_FIVETRAN
          - SERVICE_UTMBUILDER
          - SERVICE_SEGMENT
          - SERVICE_CUBE
          - SERVICE_COLLATE
          - SERVICE_OPENTOFU
      environment:
        description: "Target environment (ALL = todos)"
        required: true
        type: choice
        default: ALL
        options:
          - ALL
          - cicd
          - prod

permissions:
  contents: read

env:
  ARM_CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID }}
  ARM_CLIENT_SECRET:   ${{ secrets.AZURE_CLIENT_SECRET }}
  ARM_TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  TOFU_VERSION:        "1.11.5"

jobs:
  plan:
    name: "Tofu plan (preview con valores dummy)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./azure

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - name: Build terraform.tfvars.json with dummy values
        env:
          SERVICE_NAME: ${{ inputs.service_name }}
          ENVIRONMENT:  ${{ inputs.environment }}
        run: |
          set -euo pipefail

          ALL_SERVICES=(SERVICE_DBT SERVICE_DBT_CICD SERVICE_FIVETRAN SERVICE_UTMBUILDER SERVICE_SEGMENT SERVICE_CUBE SERVICE_COLLATE SERVICE_OPENTOFU)
          ALL_ENVS=(cicd prod)

          if [[ "$SERVICE_NAME" == "ALL" ]]; then
            SERVICES=("${ALL_SERVICES[@]}")
          else
            SERVICES=("$SERVICE_NAME")
          fi

          if [[ "$ENVIRONMENT" == "ALL" ]]; then
            ENVS=("${ALL_ENVS[@]}")
          else
            ENVS=("$ENVIRONMENT")
          fi

          echo '{"service_keys": {}}' > tfvars.json

          for SVC in "${SERVICES[@]}"; do
            for ENV in "${ENVS[@]}"; do
              SVC_KEBAB=$(echo "$SVC" | tr '[:upper:]' '[:lower:]' | tr '_' '-')
              if [[ "$ENV" == "prod" ]]; then
                ENV_PART="drhorton"
              else
                ENV_PART="drhorton${ENV}"
              fi
              KEY_NAME="snowflake-${ENV_PART}-${SVC_KEBAB}"

              jq --arg name "$KEY_NAME" \
                '.service_keys[$name] = {passphrase: "PLAN_PREVIEW", private_key: "PLAN_PREVIEW", public_key: "PLAN_PREVIEW"}' \
                tfvars.json > tfvars.tmp && mv tfvars.tmp tfvars.json
            done
          done

          mv tfvars.json terraform.tfvars.json
          echo "Preview entries: $(jq '.service_keys | length' terraform.tfvars.json)"

      - name: Tofu Init
        run: tofu init

      - name: Tofu Plan
        run: |
          echo "NOTA: este plan usa valores placeholder. El apply genera las keys reales con openssl."
          tofu plan -input=false

      - name: Cleanup tfvars
        if: always()
        run: rm -f terraform.tfvars.json

  apply:
    name: "Tofu apply (genera keys reales, requiere approval)"
    needs: plan
    runs-on: ubuntu-latest
    environment: azure-keyvault-apply
    defaults:
      run:
        working-directory: ./azure

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - name: Generate real RSA keys -> terraform.tfvars.json
        env:
          SERVICE_NAME: ${{ inputs.service_name }}
          ENVIRONMENT:  ${{ inputs.environment }}
        run: |
          set -euo pipefail

          ALL_SERVICES=(SERVICE_DBT SERVICE_DBT_CICD SERVICE_FIVETRAN SERVICE_UTMBUILDER SERVICE_SEGMENT SERVICE_CUBE SERVICE_COLLATE SERVICE_OPENTOFU)
          ALL_ENVS=(cicd prod)

          if [[ "$SERVICE_NAME" == "ALL" ]]; then
            SERVICES=("${ALL_SERVICES[@]}")
          else
            SERVICES=("$SERVICE_NAME")
          fi

          if [[ "$ENVIRONMENT" == "ALL" ]]; then
            ENVS=("${ALL_ENVS[@]}")
          else
            ENVS=("$ENVIRONMENT")
          fi

          echo '{"service_keys": {}}' > tfvars.json

          for SVC in "${SERVICES[@]}"; do
            for ENV in "${ENVS[@]}"; do
              SVC_KEBAB=$(echo "$SVC" | tr '[:upper:]' '[:lower:]' | tr '_' '-')
              if [[ "$ENV" == "prod" ]]; then
                ENV_PART="drhorton"
              else
                ENV_PART="drhorton${ENV}"
              fi
              KEY_NAME="snowflake-${ENV_PART}-${SVC_KEBAB}"
              echo "::group::Generando $KEY_NAME"

              PASSPHRASE=$(openssl rand -hex 32)
              PRIV=$(mktemp); PUB=$(mktemp)

              openssl genrsa 2048 2>/dev/null \
                | openssl pkcs8 -topk8 -v2 des3 -inform PEM \
                    -out "$PRIV" -passout "pass:$PASSPHRASE"
              openssl rsa -in "$PRIV" -pubout -out "$PUB" \
                -passin "pass:$PASSPHRASE" 2>/dev/null

              PRIVATE_KEY=$(cat "$PRIV")
              PUBLIC_KEY=$(grep -v '^-----' "$PUB" | tr -d '\n')
              rm -f "$PRIV" "$PUB"

              jq --arg name "$KEY_NAME" \
                 --arg p    "$PASSPHRASE" \
                 --arg priv "$PRIVATE_KEY" \
                 --arg pub  "$PUBLIC_KEY" \
                '.service_keys[$name] = {passphrase: $p, private_key: $priv, public_key: $pub}' \
                tfvars.json > tfvars.tmp && mv tfvars.tmp tfvars.json

              echo "::endgroup::"
            done
          done

          mv tfvars.json terraform.tfvars.json
          echo "Total entries: $(jq '.service_keys | length' terraform.tfvars.json)"

      - name: Tofu Init
        run: tofu init

      - name: Tofu Apply
        run: tofu apply -input=false -auto-approve

      - name: Cleanup tfvars
        if: always()
        run: rm -f terraform.tfvars.json
