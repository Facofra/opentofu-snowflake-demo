name: "Generate Snowflake Service Keys"

on:
  workflow_dispatch:
    inputs:
      service_name:
        description: "Snowflake service user (ALL = todos)"
        required: true
        type: choice
        options:
          - ALL
          - SERVICE_DBT
          - SERVICE_DBT_CICD
          - SERVICE_FIVETRAN
          - SERVICE_UTMBUILDER
          - SERVICE_SEGMENT
          - SERVICE_CUBE
          - SERVICE_COLLATE
      environment:
        description: "Target environment (ALL = todos)"
        required: true
        type: choice
        options:
          - ALL
          - cicd
          - prod

permissions:
  contents: read

jobs:
  prepare:
    name: "Build matrix"
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - name: Build service x environment matrix
        id: build
        env:
          SERVICE_NAME: ${{ inputs.service_name }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail

          ALL_SERVICES='["SERVICE_DBT","SERVICE_DBT_CICD","SERVICE_FIVETRAN","SERVICE_UTMBUILDER","SERVICE_SEGMENT","SERVICE_CUBE","SERVICE_COLLATE"]'
          ALL_ENVIRONMENTS='["cicd","prod"]'

          if [ "${SERVICE_NAME}" = "ALL" ]; then
            SERVICES="${ALL_SERVICES}"
          else
            SERVICES="[\"${SERVICE_NAME}\"]"
          fi

          if [ "${ENVIRONMENT}" = "ALL" ]; then
            ENVIRONMENTS="${ALL_ENVIRONMENTS}"
          else
            ENVIRONMENTS="[\"${ENVIRONMENT}\"]"
          fi

          MATRIX=$(jq -c -n \
            --argjson services "${SERVICES}" \
            --argjson environments "${ENVIRONMENTS}" \
            '{include: [$services[] as $s | $environments[] as $e | {service: $s, environment: $e}]}')

          echo "matrix=${MATRIX}" >> "${GITHUB_OUTPUT}"
          echo "Matrix: ${MATRIX}"

  generate-keys:
    name: "Generate RSA key pair (${{ matrix.service }} / ${{ matrix.environment }})"
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - name: Generate RSA key pair and print
        env:
          SERVICE_NAME: ${{ matrix.service }}
          ENVIRONMENT: ${{ matrix.environment }}
        run: |
          set -euo pipefail

          SECRET_PREFIX="${ENVIRONMENT}-snowflake-$(echo "${SERVICE_NAME}" | tr '[:upper:]' '[:lower:]' | tr '_' '-')"

          PASSPHRASE=$(openssl rand -hex 32)

          openssl genrsa 2048 2>/dev/null | \
            openssl pkcs8 -topk8 -v2 des3 -inform PEM \
            -out rsa_key.p8 -passout "pass:${PASSPHRASE}"

          openssl rsa -in rsa_key.p8 -pubout \
            -out rsa_key.pub -passin "pass:${PASSPHRASE}" 2>/dev/null

          PUBLIC_KEY=$(grep -v "^-----" rsa_key.pub | tr -d '\n')

          echo "=== ${SECRET_PREFIX}-passphrase ==="
          echo "${PASSPHRASE}"
          echo ""
          echo "=== ${SECRET_PREFIX}-private-key ==="
          cat rsa_key.p8
          echo ""
          echo "=== ${SECRET_PREFIX}-public-key (stripped) ==="
          echo "${PUBLIC_KEY}"

          rm -f rsa_key.p8 rsa_key.pub
